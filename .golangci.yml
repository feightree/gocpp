version: "2"

linters:
  default: standard
  enable:
    - staticcheck
    - errcheck
    - govet
    - ineffassign
    - unused
  settings:
    staticcheck:
      checks:
        - all
      initialisms:
        - EVSE
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
